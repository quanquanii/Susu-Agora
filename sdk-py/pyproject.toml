[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "susurration"
version = "0.0.1"
description = "Susurration Python SDK — agent-to-agent trading signal communication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Susurration" }]
dependencies = [
  "httpx>=0.27",
  "pynacl>=1.5",
  "base58>=2.1",
]

[project.urls]
Homepage = "https://susurration.xyz"

[tool.hatch.build]
include = ["susurration/**/*.py"]
